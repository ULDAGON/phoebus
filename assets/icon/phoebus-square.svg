<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"
     role="img" aria-label="Phoebus">
  <title>Phoebus</title>

  <!--
    The full-bleed variant: the same mark on an edge-to-edge navy field, no plate and no
    transparent margin. This is what Linux desktops want (they draw their own frame, if
    any) and it is also the source for the embedded window icon.

    Proportions are assets/icon/reference.jpg's, measured against the whole canvas:
      ring   outer diameter 86.2 %, stroke 13.5 %  ->  r 372.22, stroke-width 138.24
      play   equilateral, circumradius 32.63 %, corner radius 2.95 %, centroid 1.28 %
             left of the ring centre.
  -->

  <defs>
    <linearGradient id="field" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#303B49"/>
      <stop offset="1" stop-color="#2A3440"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#field)"/>

  <!-- The mark sits at 0.85 of its measured size, matching phoebus.svg's shrink: the
       full-size ring (86.2 % of the canvas) crowds the edges once desktops frame the
       tile, so the group is scaled down about the canvas centre (~73 % now). -->
  <g fill="#FEFB54" transform="translate(512 512) scale(0.85) translate(-512 -512)">
    <circle cx="512" cy="512" r="372.22" fill="none" stroke="#FEFB54" stroke-width="138.24"/>
    <path d="M 377.14 248.79 L 787.71 485.84 A 30.21 30.21 0 0 1 787.71 538.16 L 377.14 775.21 A 30.21 30.21 0 0 1 331.83 749.04 L 331.83 274.96 A 30.21 30.21 0 0 1 377.14 248.79 Z"/>
  </g>
</svg>
