<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"
     role="img" aria-label="Phoebus">
  <title>Phoebus</title>

  <!--
    The macOS icon: an Apple Big Sur plate (824 x 824 centred in a 1024 canvas, i.e. the
    body fills 80.5 % of the canvas and the rest is transparent margin) carrying the mark
    from assets/icon/reference.jpg.

    The plate outline is traced from the mask macOS 26 composites for its own apps
    (IconServices' 1024 px render of Music.app, alpha edge sampled at sub-pixel precision,
    the four corners folded together): eight cubics per corner through the measured
    boundary, straight edges between. A superellipse reads visibly rounder at the corner
    shoulders next to stock icons — assets/README.md documents the measurement.

    Mark geometry is the reference bitmap's, expressed against the 824 plate:
      ring   outer diameter 86.2 %, stroke 13.5 %  ->  r 299.52, stroke-width 111.24
      play   equilateral, corner radius 10 % of the ring's inner radius, inscribed in the
             inner circle: the three corner arcs sit on the r_inner - r_corner circle about
             the ring centre, so each arc is exactly tangent to the ring. All three corners
             kiss the ring and the gaps read even — the reference measures the same
             (corner reach 309.2 vs inner radius 308.5 on its 1043 px canvas).
  -->

  <defs>
    <path id="plate" d="M 100.00 361.52 C 100.00 344.84 100.69 328.14 102.20 311.53 C 103.73 294.77 105.13 277.88 109.08 261.53 C 113.14 244.72 117.93 227.76 126.13 212.54 C 135.91 194.38 147.87 177.04 162.45 162.45 C 177.04 147.87 194.38 135.91 212.54 126.13 C 227.76 117.93 244.72 113.14 261.53 109.08 C 277.88 105.13 294.77 103.73 311.53 102.20 C 328.14 100.69 344.84 100.00 361.52 100.00 L 662.48 100.00 C 679.16 100.00 695.86 100.69 712.47 102.20 C 729.23 103.73 746.12 105.13 762.47 109.08 C 779.28 113.14 796.24 117.93 811.46 126.13 C 829.62 135.91 846.96 147.87 861.55 162.45 C 876.13 177.04 888.09 194.38 897.87 212.54 C 906.07 227.76 910.86 244.72 914.92 261.53 C 918.87 277.88 920.27 294.77 921.80 311.53 C 923.31 328.14 924.00 344.84 924.00 361.52 L 924.00 662.48 C 924.00 679.16 923.31 695.86 921.80 712.47 C 920.27 729.23 918.87 746.12 914.92 762.47 C 910.86 779.28 906.07 796.24 897.87 811.46 C 888.09 829.62 876.13 846.96 861.55 861.55 C 846.96 876.13 829.62 888.09 811.46 897.87 C 796.24 906.07 779.28 910.86 762.47 914.92 C 746.12 918.87 729.23 920.27 712.47 921.80 C 695.86 923.31 679.16 924.00 662.48 924.00 L 361.52 924.00 C 344.84 924.00 328.14 923.31 311.53 921.80 C 294.77 920.27 277.88 918.87 261.53 914.92 C 244.72 910.86 227.76 906.07 212.54 897.87 C 194.38 888.09 177.04 876.13 162.45 861.55 C 147.87 846.96 135.91 829.62 126.13 811.46 C 117.93 796.24 113.14 779.28 109.08 762.47 C 105.13 746.12 103.73 729.23 102.20 712.47 C 100.69 695.86 100.00 679.16 100.00 662.48 Z"/>

    <!-- A few per cent lighter at the top: enough to stop the plate reading as a flat
         sticker in the Dock, not enough to turn a flat brand into a gradient. -->
    <linearGradient id="plate-fill" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#303B49"/>
      <stop offset="1" stop-color="#2A3440"/>
    </linearGradient>

    <!-- Hairline rim light along the top edge, clipped to the plate so only its inner
         half survives. -->
    <linearGradient id="plate-rim" x1="512" y1="100" x2="512" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="plate-clip">
      <use href="#plate"/>
    </clipPath>
  </defs>

  <use href="#plate" fill="url(#plate-fill)"/>

  <!-- The mark sits at 0.85 of its measured size: the reference bitmap runs the ring to
       86.2 % of the plate, which crowds the Dock tile, so the whole group is scaled down
       about the plate centre (ring outer diameter now ~73 % of the plate). -->
  <g fill="#FEFB54" transform="translate(512 512) scale(0.85) translate(-512 -512)">
    <circle cx="512" cy="512" r="299.52" fill="none" stroke="#FEFB54" stroke-width="111.24"/>
    <path d="M 743.71 533.12 L 414.44 723.22 A 24.39 24.39 0 0 1 377.86 702.10 L 377.85 321.90 A 24.39 24.39 0 0 1 414.44 300.78 L 743.70 490.88 A 24.39 24.39 0 0 1 743.71 533.12 Z"/>
  </g>

  <use href="#plate" fill="none" stroke="url(#plate-rim)" stroke-width="4" clip-path="url(#plate-clip)"/>
</svg>
