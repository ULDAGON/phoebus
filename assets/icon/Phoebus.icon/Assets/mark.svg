<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"
     role="img" aria-label="Phoebus">
  <title>Phoebus</title>

  <!--
    The mark alone, on nothing: the bottom layer of assets/icon/Phoebus.icon's mark group.
    macOS 26 supplies the plate, the mask and the shading, so this file must contain only
    the foreground — the ring and the play triangle, transparent everywhere else.

    Same geometry as phoebus-square.svg's mark: ring outer radius 349.18, inner 226.30
    (68.2 % of the canvas across), triangle circumradius 201.41 with 10.07 corners.

    Every shape is a filled path. Icon Composer flattens a stroked shape to the region its
    outline encloses — the ring drawn as `stroke` on a `circle` renders as a solid disc —
    so the ring is an even-odd annulus and the colour comes from the layer's `fill` in
    icon.json, not from here. The `#FFF73B` below only makes the file legible on its own.
  -->

  <g fill="#FFF73B">
    <path fill-rule="evenodd"
          d="M 162.82 512 A 349.18 349.18 0 1 0 861.18 512 A 349.18 349.18 0 1 0 162.82 512 Z
             M 285.70 512 A 226.30 226.30 0 1 0 738.30 512 A 226.30 226.30 0 1 0 285.70 512 Z"/>
    <path d="M 698.30 503.28 A 10.07 10.07 0 0 1 698.30 520.72 L 426.40 677.71 A 10.07 10.07 0 0 1 411.29 668.98 L 411.29 355.02 A 10.07 10.07 0 0 1 426.40 346.29 Z"/>
  </g>
</svg>
